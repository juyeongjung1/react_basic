<svg xmlns="http://www.w3.org/2000/svg" width="380" height="136" viewBox="0 0 380 136">
  <rect x="4" y="5" width="178" height="126" rx="6" fill="#ffffff" stroke="#aabfcf" stroke-width="0.8"/>
  <rect x="5" y="6" width="176" height="23" rx="5" fill="#fff4d5" stroke="none" stroke-width="0.8"/>
  <text x="93" y="21.6" font-size="11.6" fill="#805900" font-weight="700" text-anchor="middle" font-family="Meiryo, sans-serif">valueのみ</text>
  <text x="93" y="45" font-size="11.7" fill="#183449" font-weight="700" text-anchor="middle" font-family="MS Gothic, monospace">value={productName}</text>
  <rect x="15" y="52" width="156" height="20" rx="4" fill="#fff4d5" stroke="none" stroke-width="0.8"/>
  <text x="93" y="66" font-size="10.3" fill="#805900" font-weight="700" text-anchor="middle" font-family="Meiryo, sans-serif">onChangeがない</text>
  <rect x="15" y="80" width="156" height="23" rx="4" fill="#ffffff" stroke="#aabfcf" stroke-width="0.8"/>
  <text x="23" y="96" font-size="11.3" fill="#183449" font-weight="400" text-anchor="start" font-family="Meiryo, sans-serif">ノート</text>
  <text x="93" y="120" font-size="10.3" fill="#805900" font-weight="700" text-anchor="middle" font-family="Meiryo, sans-serif">入力しても変更を保持できない</text>
  <rect x="198" y="5" width="178" height="126" rx="6" fill="#ffffff" stroke="#aabfcf" stroke-width="0.8"/>
  <rect x="199" y="6" width="176" height="23" rx="5" fill="#e8f5ed" stroke="none" stroke-width="0.8"/>
  <text x="287" y="21.6" font-size="11.6" fill="#226757" font-weight="700" text-anchor="middle" font-family="Meiryo, sans-serif">valueとonChange</text>
  <text x="287" y="45" font-size="11.7" fill="#183449" font-weight="700" text-anchor="middle" font-family="MS Gothic, monospace">value={productName}</text>
  <rect x="209" y="52" width="156" height="20" rx="4" fill="#e8f5ed" stroke="none" stroke-width="0.8"/>
  <text x="287" y="66" font-size="10.3" fill="#226757" font-weight="700" text-anchor="middle" font-family="Meiryo, sans-serif">onChangeでstateを更新</text>
  <rect x="209" y="80" width="156" height="23" rx="4" fill="#ffffff" stroke="#86b7fe" stroke-width="0.8"/>
  <text x="217" y="96" font-size="11.3" fill="#183449" font-weight="400" text-anchor="start" font-family="Meiryo, sans-serif">ノートPC</text>
  <text x="287" y="120" font-size="10.3" fill="#226757" font-weight="700" text-anchor="middle" font-family="Meiryo, sans-serif">入力した値がフォームに残る</text>
