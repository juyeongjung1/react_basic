  <text x="303.5" y="60.725" font-family="Meiryo, MS Gothic, sans-serif" font-size="13.5" fill="#183449" font-weight="400" text-anchor="middle">入力欄：ノート</text>
  <rect x="19" y="75" width="340" height="71" rx="6" fill="#f0f5fa" stroke="#aabfcf" stroke-width="1.4"/>
  <text x="189" y="116.38" font-family="Courier New, MS Gothic" font-size="16.8" fill="#183449" font-weight="400" text-anchor="middle">value={productName}</text>
  <text x="189" y="168" font-family="Meiryo, MS Gothic, sans-serif" font-size="17.6" fill="#205b84" font-weight="700" text-anchor="middle">「ノートPC」と入力しようとする</text>
  <polyline points="189,175 189,184" fill="none" stroke="#205b84" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>
