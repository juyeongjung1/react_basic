<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="370" viewBox="0 0 760 370">
  <rect x="7" y="7" width="364" height="247" rx="8" fill="white" stroke="#aabfcf" stroke-width="1.4"/>
  <rect x="8" y="8" width="362" height="32" rx="7" fill="#205b84" stroke="none" stroke-width="1.4"/>
  <text x="189" y="31" font-family="Meiryo, MS Gothic, sans-serif" font-size="19" fill="white" font-weight="700" text-anchor="middle">valueのみ</text>
  <text x="21" y="63" font-family="Courier New, MS Gothic" font-size="15.5" fill="#183449" font-weight="400" text-anchor="start">productName = &#x27;ノート&#x27;</text>
