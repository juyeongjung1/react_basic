<text x="176" y="168" font-family="Meiryo" font-size="9.3" fill="#172f44" text-anchor="middle" font-weight="400">TypeScriptの関数</text>
<text x="176" y="185" font-family="Meiryo" font-size="9.3" fill="#172f44" text-anchor="middle" font-weight="400">として記述する</text>
