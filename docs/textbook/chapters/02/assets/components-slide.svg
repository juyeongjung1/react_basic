<text x="294" y="76" font-family="MS Gothic" font-size="10.3" fill="#98512d" text-anchor="middle" font-weight="700">&lt;h1&gt;見出し&lt;/h1&gt;</text>
<text x="58" y="130" font-family="Meiryo" font-size="11.3" fill="#245983" text-anchor="middle" font-weight="700">コンポーネント</text>
<text x="58" y="151" font-family="Meiryo" font-size="9.3" fill="#172f44" text-anchor="middle" font-weight="400">画面を部品として</text>
