<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="270" height="205" viewBox="0 0 270 205">
<text x="5" y="16" font-family="Meiryo" font-size="11" fill="#245983" text-anchor="start" font-weight="700"><tspan x="5">計算に</tspan><tspan x="5" dy="14">使用する値</tspan></text>
<rect x="85" y="5" width="179" height="34" rx="4" fill="#eaf3fc" stroke="#a5c2db" stroke-width="0.9"/>
<text x="94" y="18" font-family="MS Gothic" font-size="9.8" fill="#172f44" text-anchor="start" font-weight="400">product.price → 250</text>
<text x="94" y="31" font-family="MS Gothic" font-size="9.8" fill="#172f44" text-anchor="start" font-weight="400">quantity → 2</text>
<path d="M175 42 L175 50" fill="none" stroke="#44627b" stroke-width="1.4" stroke-linecap="round"/>
<path d="M171.4 50h7.2L175 55Z" fill="#44627b"/>
<text x="5" y="78" font-family="Meiryo" font-size="11" fill="#246a5c" text-anchor="start" font-weight="700">JSXの計算式</text>
<rect x="85" y="60" width="179" height="51" rx="4" fill="#e8f5f0" stroke="#a7cabf" stroke-width="0.9"/>
<rect x="94" y="64" width="162" height="20" rx="3" fill="#ffffff" stroke="#b64a2a" stroke-width="0.9"/>
<text x="175" y="78" font-family="MS Gothic" font-size="10.8" fill="#246a5c" text-anchor="middle" font-weight="700">{product.price * quantity}</text>
<text x="175" y="101" font-family="Meiryo" font-size="11" fill="#172f44" text-anchor="middle">250 × 2 = 500</text>
<path d="M175 116 L175 124" fill="none" stroke="#44627b" stroke-width="1.4" stroke-linecap="round"/>
