<rect x="86" y="113" width="177" height="21" rx="4" fill="#eaf1f7" stroke="none" stroke-width="0.9"/>
<path d="M86 134 L263 134" fill="none" stroke="#bacddb" stroke-width="1" stroke-linecap="round"/>
<text x="94" y="127" font-family="Meiryo" font-size="9.7" fill="#44627b" text-anchor="start" font-weight="400">商品情報</text>
<text x="97" y="157" font-family="Meiryo" font-size="14.5" fill="#0d6efd" text-anchor="start" font-weight="700">合計：500円</text>
