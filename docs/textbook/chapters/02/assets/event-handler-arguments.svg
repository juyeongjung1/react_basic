<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="594" height="231" viewBox="0 0 594 231">
<rect x="4" y="5" width="343" height="106" fill="#edf5f9" stroke="#b4c8d8" rx="6" stroke-width="0.9"/>
<rect x="14" y="13" width="158" height="24" fill="white" stroke="#0d6efd" rx="5" stroke-width="0.9"/>
<text x="93" y="30" font-size="14" font-family="Meiryo" fill="#215d89" font-weight="700" text-anchor="middle">ノートを選択</text>
<text x="15" y="60" font-size="13.2" font-family="MS Gothic" fill="#183449" font-weight="400" text-anchor="start">onClick={() =&gt; showSelection(&#x27;ノート&#x27;)}</text>
<text x="331" y="92" font-size="14" font-family="Meiryo" fill="#215d89" font-weight="700" text-anchor="end">クリック時に「ノート」を渡す</text>
<polyline points="350,87 375,87 375,115 394,115" fill="none" stroke="#215d89" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="387,118.71 394,115 387,111.29" fill="#215d89"/>
<rect x="4" y="119" width="343" height="106" fill="#edf5f9" stroke="#b4c8d8" rx="6" stroke-width="0.9"/>
<rect x="14" y="127" width="158" height="24" fill="white" stroke="#0d6efd" rx="5" stroke-width="0.9"/>
<text x="93" y="144" font-size="14" font-family="Meiryo" fill="#215d89" font-weight="700" text-anchor="middle">ボールペンを選択</text>
<text x="15" y="174" font-size="13.2" font-family="MS Gothic" fill="#183449" font-weight="400" text-anchor="start">onClick={() =&gt; showSelection(&#x27;ボールペン&#x27;)}</text>
<text x="331" y="206" font-size="14" font-family="Meiryo" fill="#215d89" font-weight="700" text-anchor="end">クリック時に「ボールペン」を渡す</text>
<polyline points="350,201 375,201 375,115 394,115" fill="none" stroke="#215d89" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="387,118.71 394,115 387,111.29" fill="#215d89"/>
<rect x="400" y="57" width="190" height="114" fill="#e8f4ef" stroke="#a6c9bd" rx="6" stroke-width="0.9"/>
<text x="495" y="81" font-size="16" font-family="Meiryo" fill="#21685d" font-weight="700" text-anchor="middle">共通の関数</text>
<text x="495" y="105" font-size="15" font-family="MS Gothic" fill="#21685d" font-weight="700" text-anchor="middle">showSelection(name)</text>
<text x="495" y="133" font-size="14" font-family="Meiryo" fill="#183449" font-weight="400" text-anchor="middle">受け取った商品名を</text>
<text x="495" y="154" font-size="14" font-family="Meiryo" fill="#183449" font-weight="400" text-anchor="middle">stateに設定する</text>
