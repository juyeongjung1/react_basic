<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="417" height="172" viewBox="0 0 417 172">
<rect x="4" y="4" width="199" height="163" fill="#e8f4ef" stroke="#b4c8d8" rx="6" stroke-width="0.9"/>
<text x="15" y="24" font-size="12.5" font-family="Meiryo" fill="#21685d" font-weight="700" text-anchor="start">正しい書き方</text>
<rect x="13" y="32" width="181" height="25" fill="#fff" stroke="#b4c8d8" rx="4" stroke-width="0.9"/>
<text x="20" y="49" font-size="12" font-family="MS Gothic" fill="#183449" font-weight="400" text-anchor="start">onClick={clearSelection}</text>
<text x="16" y="78" font-size="11.3" font-family="Meiryo" fill="#21685d" font-weight="700" text-anchor="start">レンダリング中：関数を渡す</text>
<polyline points="24,88 24,115" fill="none" stroke="#21685d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="20.82,109 24,115 27.18,109" fill="#21685d"/>
<text x="38" y="105" font-size="10.7" font-family="Meiryo" fill="#21685d" font-weight="400" text-anchor="start">［選択を解除］をクリック</text>
<text x="16" y="137" font-size="11.3" font-family="Meiryo" fill="#21685d" font-weight="700" text-anchor="start">クリック後：</text>
<text x="16" y="153" font-size="11.3" font-family="Meiryo" fill="#183449" font-weight="400" text-anchor="start">clearSelection() が実行される</text>
<rect x="214" y="4" width="199" height="163" fill="#fff1eb" stroke="#b4c8d8" rx="6" stroke-width="0.9"/>
<text x="225" y="24" font-size="12.5" font-family="Meiryo" fill="#bd3536" font-weight="700" text-anchor="start">誤った書き方</text>
<rect x="223" y="32" width="181" height="25" fill="#fff" stroke="#b4c8d8" rx="4" stroke-width="0.9"/>
<rect x="366.5" y="36" width="15" height="17" fill="none" stroke="#bd3536" rx="0" stroke-width="1.3"/>
<text x="230" y="49" font-size="12" font-family="MS Gothic" fill="#183449" font-weight="400" text-anchor="start">onClick={clearSelection()}</text>
<text x="226" y="78" font-size="11.3" font-family="Meiryo" fill="#bd3536" font-weight="700" text-anchor="start">レンダリング中：</text>
<text x="226" y="96" font-size="11.3" font-family="Meiryo" fill="#183449" font-weight="400" text-anchor="start">clearSelection() が実行される</text>
<text x="226" y="137" font-size="10.7" font-family="Meiryo" fill="#bd3536" font-weight="700" text-anchor="start">クリックする前に実行されてしまう</text>
</svg>
