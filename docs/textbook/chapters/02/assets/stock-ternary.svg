  <path d="M 286.0 39 V 56 L 319 71" stroke="#b12d35" fill="none" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="264" y="72" width="110" height="46" rx="5" fill="#fff1f0" stroke="#aabfcf" stroke-width="0.8"/>
