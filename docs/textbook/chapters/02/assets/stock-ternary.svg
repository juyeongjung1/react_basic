  <text x="319" y="106" font-size="9.1" fill="#183449" font-weight="400" text-anchor="middle" font-family="Meiryo, sans-serif">「在庫切れ」を選ぶ</text>
  <text x="135" y="31" font-size="15" fill="#205b84" font-weight="700" text-anchor="middle" font-family="MS Gothic, monospace">?</text>
