<rect x="224" y="25" width="152" height="123" rx="5" fill="#ffffff" stroke="#b9cada" stroke-width="0.8"/>
<rect x="225" y="26" width="150" height="16" rx="4" fill="#edf3f8" stroke="none" stroke-width="0.8"/>
