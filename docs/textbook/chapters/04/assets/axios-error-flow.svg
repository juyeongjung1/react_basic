<svg xmlns="http://www.w3.org/2000/svg" width="740" height="347" viewBox="0 0 740 347" font-family="Meiryo, sans-serif" role="img">
<title>tryブロック内で例外が発生した場合はcatchブロックの処理を実行する</title>
<rect x="12" y="7" width="716" height="66" rx="6" fill="#eaf3fa" stroke="#a7bdce" stroke-width="1"/>
