<text x="59" y="57" font-size="17.8" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">  const response = await axios.get&lt;Product[]&gt;(&#x27;/api/products&#x27;)</text>
