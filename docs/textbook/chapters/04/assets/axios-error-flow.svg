<text x="520" y="139" font-size="20.6" fill="#b42331" text-anchor="middle" font-weight="700" xml:space="preserve">例外が発生</text>
<text x="327" y="166" font-size="16" fill="#4d6475" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">20</text>
<text x="359" y="166" font-size="17.8" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">} </text>
<text x="379" y="166" font-size="17.8" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">catch (error)</text>
<text x="509" y="166" font-size="17.8" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve"> {</text>
<rect x="376" y="151" width="132" height="20" rx="0" fill="none" stroke="#b42331" stroke-width="1.8"/>
