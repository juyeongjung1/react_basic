<text x="56" y="176" font-size="16.9" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">setProducts(response.data)</text>
<path d="M156 221V290m-4 -6 4 6 4 -6" fill="none" stroke="#24664e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
