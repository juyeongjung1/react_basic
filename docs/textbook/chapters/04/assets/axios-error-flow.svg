<text x="359" y="192" font-size="17.8" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">  console.error(error)</text>
<text x="327" y="215" font-size="16" fill="#4d6475" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">22</text>
<text x="359" y="215" font-size="17.8" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">  setErrorMessage(</text>
<text x="392" y="236" font-size="17.0" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">&#x27;商品情報の取得に失敗しました。&#x27;)</text>
