<text x="47" y="75" font-size="18" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">  useEffect(() =&gt; {</text>
<text x="34" y="96" font-size="16.0" fill="#4d6475" text-anchor="end" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">15</text>
<text x="47" y="96" font-size="18" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">    async function loadProducts() {</text>
