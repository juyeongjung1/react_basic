<text x="34" y="201" font-size="16.0" fill="#4d6475" text-anchor="end" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">20</text>
<text x="47" y="201" font-size="18" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">    loadProducts()</text>
<text x="34" y="222" font-size="16.0" fill="#4d6475" text-anchor="end" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">21</text>
