<text x="47" y="117" font-size="18" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">      const response = await axios.get&lt;Product[]&gt;(&#x27;/api/products&#x27;)</text>
<text x="34" y="138" font-size="16.0" fill="#4d6475" text-anchor="end" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">17</text>
<text x="47" y="138" font-size="18" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">      setProducts(response.data)</text>
<text x="34" y="159" font-size="16.0" fill="#4d6475" text-anchor="end" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">18</text>
<text x="47" y="159" font-size="18" fill="#18364e" text-anchor="start" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">    }</text>
<text x="34" y="180" font-size="16.0" fill="#4d6475" text-anchor="end" font-family="Consolas, MS Gothic, monospace" xml:space="preserve">19</text>
