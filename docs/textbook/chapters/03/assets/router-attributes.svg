<svg xmlns="http://www.w3.org/2000/svg" width="400" height="151" viewBox="0 0 400 151" font-family="Meiryo, sans-serif">
  <title>Routeのpathとelementの対応</title>
  <rect x="5" y="5" width="390" height="89" rx="5" fill="#f4f7fa" stroke="#adbfce" stroke-width=".9"/>
  <rect x="26" y="28" width="347" height="22" rx="3" fill="#edf5fa" stroke="none" stroke-width=".9"/>
  <rect x="26" y="51" width="347" height="22" rx="3" fill="#e9f4ef" stroke="none" stroke-width=".9"/>
  <text x="18" y="24" font-size="13" fill="#1b3145" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">&lt;Route</text>
  <text x="36" y="44" font-size="13.5" fill="#205c84" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">path="/products"</text>
  <text x="36" y="67" font-size="13.5" fill="#23695b" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">element={&lt;Sample3_1 /&gt;}</text>
  <text x="18" y="87" font-size="13" fill="#1b3145" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">/&gt;</text>
  <rect x="5" y="107" width="180" height="39" rx="5" fill="#edf5fa" stroke="#adbfce" stroke-width=".9"/>
  <text x="17" y="124" font-size="12" fill="#205c84" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">path</text>
  <text x="17" y="139" font-size="10.5" fill="#205c84" font-weight="400" text-anchor="start">アクセスするURLのパス</text>
  <path d="M187 126H208" stroke="#23695b" stroke-width="1.3" fill="none"/><path d="M208 123l5 3-5 3Z" fill="#23695b"/>
  <rect x="215" y="107" width="180" height="39" rx="5" fill="#e9f4ef" stroke="#a9c7b5" stroke-width=".9"/>
  <text x="227" y="124" font-size="12" fill="#23695b" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">element</text>
  <text x="227" y="139" font-size="10.5" fill="#23695b" font-weight="400" text-anchor="start">表示するコンポーネント</text>
</svg>
