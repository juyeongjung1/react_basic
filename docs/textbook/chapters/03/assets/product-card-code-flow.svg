<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170" font-family="Meiryo, sans-serif">
  <title>親で商品データを用意し、子のJSXで商品カードを表示する流れ</title>
  <rect x="4" y="5" width="391" height="91" rx="5" fill="#edf5fa" stroke="#b4c6d3" stroke-width=".85"/>
  <rect x="4" y="102" width="391" height="62" rx="5" fill="#e9f4ef" stroke="#adcbbe" stroke-width=".85"/>
  <text x="14" y="35" font-size="12.5" fill="#205c84" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">Sample3_1</text>
  <text x="14" y="53" font-size="10.3" fill="#205c84" font-weight="700" text-anchor="start">親コンポーネント</text>
  <text x="14" y="128" font-size="12.5" fill="#23695b" font-weight="700" text-anchor="start" font-family="Consolas, MS Gothic, monospace">ProductCard</text>
  <text x="14" y="146" font-size="10.3" fill="#23695b" font-weight="700" text-anchor="start">子コンポーネント</text>
  <rect x="119" y="11" width="264" height="22" rx="5" fill="#ffffff" stroke="#b5c9d5" stroke-width=".85"/>
  <circle cx="132" cy="22" r="8" fill="#205c84"/>
  <text x="132" y="25.8" font-size="9.8" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="146" y="26" font-size="10.5" fill="#1b3145" font-weight="400" text-anchor="start">6件の商品データを用意する</text>
  <path d="M246 33V34" fill="none" stroke="#205c84" stroke-width="1.25"/><path d="m243 34 3 5 3-5Z" fill="#205c84"/>
  <rect x="119" y="39" width="264" height="22" rx="5" fill="#ffffff" stroke="#b5c9d5" stroke-width=".85"/>
  <circle cx="132" cy="50" r="8" fill="#205c84"/>
  <text x="132" y="53.8" font-size="9.8" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="146" y="54" font-size="10.5" fill="#1b3145" font-weight="400" text-anchor="start">map()で商品を1件ずつ取り出す</text>
  <path d="M246 61V62" fill="none" stroke="#205c84" stroke-width="1.25"/><path d="m243 62 3 5 3-5Z" fill="#205c84"/>
  <rect x="119" y="67" width="264" height="22" rx="5" fill="#ffffff" stroke="#b5c9d5" stroke-width=".85"/>
  <circle cx="132" cy="78" r="8" fill="#205c84"/>
  <text x="132" y="81.8" font-size="9.8" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="146" y="82" font-size="10.5" fill="#1b3145" font-weight="400" text-anchor="start">画像のパス・商品名・単価をPropsとして渡す</text>
  <path d="M246 89V103" fill="none" stroke="#205c84" stroke-width="1.25"/><path d="m243 103 3 5 3-5Z" fill="#205c84"/>
  <rect x="119" y="108" width="264" height="22" rx="5" fill="#ffffff" stroke="#b5c9d5" stroke-width=".85"/>
  <circle cx="132" cy="119" r="8" fill="#23695b"/>
  <text x="132" y="122.8" font-size="9.8" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="146" y="123" font-size="10.5" fill="#1b3145" font-weight="400" text-anchor="start">ProductCardがPropsを受け取る</text>
  <path d="M246 130V131" fill="none" stroke="#23695b" stroke-width="1.25"/><path d="m243 131 3 5 3-5Z" fill="#23695b"/>
  <rect x="119" y="136" width="264" height="22" rx="5" fill="#ffffff" stroke="#b5c9d5" stroke-width=".85"/>
  <circle cx="132" cy="147" r="8" fill="#23695b"/>
  <text x="132" y="150.8" font-size="9.8" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="146" y="151" font-size="10.5" fill="#1b3145" font-weight="400" text-anchor="start">JSXで商品画像・商品名・単価を表示する</text>
