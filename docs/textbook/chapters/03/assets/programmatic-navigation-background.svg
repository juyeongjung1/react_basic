<path d="M342.5 175L342.5 187M345.50 182.00L342.5 187L339.50 182.00" fill="none" stroke="#355971" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="242" y="190" width="201" height="33" rx="4" fill="#fff5e8" stroke="#b78556" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="342.5" y="211" font-size="12" fill="#71471f" text-anchor="middle" font-weight="700">登録に成功したか</text>
<path d="M342.5 224V237H111V249M342.5 237H346V249" fill="none" stroke="#416378" stroke-width="1.4"/>
<path d="M111 249L111 267M114.00 262.00L111 267L108.00 262.00" fill="none" stroke="#256950" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
