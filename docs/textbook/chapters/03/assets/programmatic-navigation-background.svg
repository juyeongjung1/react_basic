<text x="372" y="252" font-size="11.9" fill="#9f4c3d" text-anchor="middle" font-weight="700">失敗</text>
<rect x="10" y="270" width="202" height="75" rx="4" fill="#eff7f2" stroke="#abcbbb" stroke-width="1"/>
