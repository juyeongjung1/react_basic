<svg xmlns="http://www.w3.org/2000/svg" width="460" height="377" viewBox="0 0 460 377" font-family="Meiryo, sans-serif" role="img">
<title>登録処理の結果に応じて画面を切り替える</title>
<text x="230" y="21" font-size="15.4" fill="#18364e" text-anchor="middle" font-weight="700">登録処理の結果に応じて画面を切り替える</text>
