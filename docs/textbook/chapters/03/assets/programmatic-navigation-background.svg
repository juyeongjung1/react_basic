<rect x="242" y="89" width="201" height="31" rx="4" fill="#edf4f9" stroke="#9eb8cb" stroke-width="1"/>
<text x="342.5" y="109" font-size="12.3" fill="#18364e" text-anchor="middle" font-weight="700">［登録］をクリック</text>
