<text x="173" y="159" font-size="10.8" fill="#18364e" text-anchor="start">円</text>
<rect x="23" y="183" width="53" height="21" rx="3" fill="#0d6efd"/><text x="49.5" y="197.24" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">登録</text><rect x="21" y="181" width="57" height="25" rx="2" fill="none" stroke="#b42331" stroke-width="1.6"/>
